name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`), through the
# suite's shared gate workflow in craft-common-actions.
on:
  push:
    branches: [main, 'trial/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      # Same craft-fonts commit as release.yml.
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      timeout-minutes: 90
      command: |
        nproc; free -m; df -h / /mnt; swapon --show
        sudo fallocate -l 12G /mnt/gate-swap && sudo chmod 600 /mnt/gate-swap && sudo mkswap /mnt/gate-swap && sudo swapon /mnt/gate-swap
        swapon --show; free -m
        ( while sleep 60; do echo "SAMPLE $(date -u +%T) mem=$(free -m | awk '/Mem:/{print $3"/"$2" avail "$7}') swap=$(free -m | awk '/Swap:/{print $3"/"$2}') disk=$(df -h / | awk 'NR==2{print $3"/"$2" avail "$4}') top=$(ps -eo rss=,comm= --sort=-rss | head -3 | awk '{printf "%s:%dM ", $2, $1/1024}')"; done ) &
        sampler=$!
        s=0; cargo xtask ci || s=$?
        kill "$sampler"; exit "$s"
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libgl1-mesa-dev
